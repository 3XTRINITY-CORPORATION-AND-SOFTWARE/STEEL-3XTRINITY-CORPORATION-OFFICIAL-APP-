# Minimal green CI for app-builder-workspace (Vite + TanStack Start).
# Replaces the broken webpack.yml (npx webpack — not this stack).
# Gates use only package.json scripts that exist: typecheck, build, test.

name: Vite CI

on:
  push:
    branches: ["main"]
  # No branch filter: stacked PRs (base != main) must be gated too, otherwise they merge unchecked.
  pull_request:

permissions:
  contents: read

concurrency:
  group: vite-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Validate devcontainer JSON
        run: |
          node -e "
          const fs=require('fs');
          JSON.parse(fs.readFileSync('.devcontainer/devcontainer.json','utf8'));
          console.log('devcontainer JSON OK');
          "

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:coverage
